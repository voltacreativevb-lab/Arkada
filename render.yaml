services:
  - type: web
    name: maestrovolta-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w shared/sablon-core && npm run build -w backend
    startCommand: node backend/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: WORKER_JWT_SECRET
        sync: false
      - key: PORT
        value: 3000

  - type: web
    name: maestrovolta-web
    runtime: static
    buildCommand: npm install && npm run build -w shared/sablon-core && npm run build -w frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
